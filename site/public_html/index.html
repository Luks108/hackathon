<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<title>Hackathon</title>
<style>
:root{--bg:#f6f7f9;--sup:#fff;--tx:#14181f;--tx2:#5b6472;--linha:#e2e5ea;--acc:#0f766e;--acc-tx:#fff;--erro:#b42318;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--sup:#181c22;--tx:#eef1f5;--tx2:#9aa3b0;--linha:#2a3038;--acc:#2dd4bf;--acc-tx:#04211d;--erro:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--sup);border-bottom:1px solid var(--linha)}
header h1{font-size:18px;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--tx2);margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-tx);font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx2);border:1px solid var(--linha)}
button:disabled{opacity:.6}
.erro{color:var(--erro);font-size:14px;min-height:1.2em}
.reg{display:flex;gap:12px;align-items:flex-start}
.reg img{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none}
.reg small{color:var(--tx2)}
pre{white-space:pre-wrap;font-size:13px;background:var(--bg);padding:8px;border-radius:6px;margin:6px 0 0}
#previa{max-width:100%;border-radius:8px;margin-top:8px;display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Hackathon</h1><button id="sair" class="sec" hidden>Sair</button></header>
<main>
  <section id="tela-login" class="cartao" hidden>
    <form id="form-login">
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
      <p class="erro" id="erro-login"></p>
      <button>Entrar</button>
    </form>
  </section>

  <section id="tela-app" hidden>
    <form id="form-registro" class="cartao">
      <label for="titulo">Título</label><input id="titulo" required>
      <label for="descricao">Descrição</label><textarea id="descricao" rows="2"></textarea>
      <label for="foto">Foto</label><input id="foto" type="file" accept="image/*" capture="environment">
      <img id="previa" alt="">
      <p class="erro" id="erro-registro"></p>
      <button id="enviar">Registrar</button>
    </form>
    <div id="lista"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
