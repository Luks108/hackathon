<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Administração | Histórico de fornecedor com prova</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="topo" id="topo"></header>

<main class="miolo pagina" id="conteudo">
  <p class="apoio" id="carregando" aria-live="polite">Carregando…</p>

  <p class="aviso-erro" id="acesso-negado" role="alert" hidden>Esta página é só para administradores.</p>

  <div id="pagina" class="pagina" hidden>
    <header>
      <h1>Telefones do WhatsApp</h1>
      <p>Aprove ou bloqueie os números que podem falar com o assistente. A decisão vale em até 15 segundos.</p>
    </header>

    <section class="cartao secao" aria-labelledby="t-fila">
      <div class="topo-da-lista">
        <h2 id="t-fila" style="margin:0">Fila de aprovação</h2>
        <span class="atualizado" id="atualizado" aria-live="off"></span>
      </div>

      <div class="abas filtros" role="tablist" aria-label="Filtrar por estado" style="margin-top:14px">
        <button type="button" role="tab" data-status="pendente" aria-selected="true">Pendentes</button>
        <button type="button" role="tab" data-status="aprovado" aria-selected="false">Aprovados</button>
        <button type="button" role="tab" data-status="revogado" aria-selected="false">Bloqueados</button>
        <button type="button" role="tab" data-status="todos" aria-selected="false">Todos</button>
      </div>

      <p class="aviso-erro" id="erro-adm" role="alert" hidden></p>
      <p class="aviso-ok" id="ok-adm" role="status" hidden></p>
      <ul class="lista" id="lista-adm" role="tabpanel" aria-label="Telefones"></ul>
      <p class="vazio" id="vazio-adm" hidden></p>
    </section>
  </div>
</main>

<script src="assets/util.js"></script>
<script src="assets/api.js"></script>
<script src="assets/topo.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
